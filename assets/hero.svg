<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1c1b"/>
      <stop offset="1" stop-color="#171a1f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a28"/>
      <stop offset="1" stop-color="#20304a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1c1b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1c1c1b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- subtle grid on the right half only (the structured side) -->
  <g stroke="#2c3646" stroke-width="1" opacity="0.55">
    <g id="vg">
      <line x1="700" y1="0" x2="700" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/><line x1="820" y1="0" x2="820" y2="400"/>
      <line x1="880" y1="0" x2="880" y2="400"/><line x1="940" y1="0" x2="940" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
      <line x1="1060" y1="0" x2="1060" y2="400"/><line x1="1120" y1="0" x2="1120" y2="400"/><line x1="1180" y1="0" x2="1180" y2="400"/><line x1="1240" y1="0" x2="1240" y2="400"/>
    </g>
    <line x1="640" y1="60" x2="1280" y2="60"/><line x1="640" y1="120" x2="1280" y2="120"/><line x1="640" y1="180" x2="1280" y2="180"/>
    <line x1="640" y1="240" x2="1280" y2="240"/><line x1="640" y1="300" x2="1280" y2="300"/><line x1="640" y1="360" x2="1280" y2="360"/>
  </g>
  <rect x="640" y="0" width="200" height="400" fill="url(#fadeL)"/>

  <!-- ground / road -->
  <path d="M0 330 C 300 318, 500 322, 640 316 S 1000 300, 1280 292 L1280 400 L0 400 Z" fill="#141413"/>
  <path d="M0 331 C 300 319, 500 323, 640 317 S 1000 301, 1280 293" stroke="url(#road)" stroke-width="3" fill="none"/>
  <!-- dashed center line, fades in toward the right -->
  <path d="M60 345 C 300 336, 520 338, 640 333 S 1000 320, 1240 312" stroke="#3a3a37" stroke-width="2" stroke-dasharray="14 18" fill="none"/>
  <path d="M640 333 S 1000 320, 1240 312" stroke="#3987e5" stroke-width="2" stroke-dasharray="14 18" fill="none" opacity="0.6"/>

  <!-- ===== LEFT: the mobile past (muted, receding) ===== -->
  <g opacity="0.75">
    <!-- phone -->
    <g transform="translate(120 120)">
      <rect x="0" y="0" width="96" height="176" rx="16" fill="#26262a" stroke="#3b3b3f" stroke-width="3"/>
      <rect x="10" y="18" width="76" height="140" rx="6" fill="#1b1b1e"/>
      <rect x="36" y="8" width="24" height="4" rx="2" fill="#3b3b3f"/>
      <!-- app icons -->
      <rect x="18" y="28" width="18" height="18" rx="4" fill="#5b5b60"/>
      <rect x="39" y="28" width="18" height="18" rx="4" fill="#4a4a4f"/>
      <rect x="60" y="28" width="18" height="18" rx="4" fill="#5b5b60"/>
      <rect x="18" y="49" width="18" height="18" rx="4" fill="#4a4a4f"/>
      <rect x="39" y="49" width="18" height="18" rx="4" fill="#5b5b60"/>
      <rect x="60" y="49" width="18" height="18" rx="4" fill="#4a4a4f"/>
      <rect x="18" y="70" width="18" height="18" rx="4" fill="#5b5b60"/>
      <rect x="39" y="70" width="18" height="18" rx="4" fill="#4a4a4f"/>
      <!-- one orange app: the one that shipped -->
      <rect x="60" y="70" width="18" height="18" rx="4" fill="#a8482a"/>
      <rect x="28" y="140" width="40" height="4" rx="2" fill="#3b3b3f"/>
    </g>
    <!-- floating UI bits drifting away -->
    <g fill="none" stroke="#4a4a4f" stroke-width="3" stroke-linecap="round">
      <rect x="250" y="96" width="70" height="44" rx="8"/>
      <line x1="262" y1="112" x2="308" y2="112"/>
      <line x1="262" y1="124" x2="294" y2="124"/>
      <rect x="290" y="190" width="54" height="54" rx="12"/>
      <circle cx="317" cy="217" r="12"/>
      <rect x="230" y="250" width="40" height="22" rx="11"/>
      <circle cx="259" cy="261" r="7" fill="#4a4a4f"/>
    </g>
    <!-- a few dots = crumbs left behind -->
    <g fill="#3b3b3f">
      <circle cx="360" cy="150" r="4"/><circle cx="392" cy="176" r="3"/><circle cx="372" cy="230" r="3"/><circle cx="410" cy="268" r="2.5"/>
    </g>
  </g>

  <!-- ===== RIGHT: agents / models / data (bright, structured) ===== -->
  <circle cx="1040" cy="190" r="220" fill="url(#glow2)"/>
  <circle cx="1040" cy="190" r="120" fill="url(#glow)"/>

  <!-- local model: a small machine with a glowing core -->
  <g transform="translate(960 120)">
    <rect x="0" y="0" width="150" height="150" rx="22" fill="#1f2632" stroke="#3987e5" stroke-width="3"/>
    <rect x="18" y="18" width="114" height="114" rx="14" fill="#182030"/>
    <!-- core: nested squares -->
    <rect x="45" y="45" width="60" height="60" rx="10" fill="#22385c"/>
    <rect x="58" y="58" width="34" height="34" rx="7" fill="#3987e5"/>
    <rect x="68" y="68" width="14" height="14" rx="3" fill="#cde2fb"/>
    <!-- vents -->
    <g stroke="#2c3a52" stroke-width="3" stroke-linecap="round">
      <line x1="30" y1="120" x2="60" y2="120"/><line x1="90" y1="120" x2="120" y2="120"/>
      <line x1="30" y1="30" x2="60" y2="30"/><line x1="90" y1="30" x2="120" y2="30"/>
    </g>
    <!-- status light -->
    <circle cx="132" cy="18" r="6" fill="#1baf7a"/>
  </g>

  <!-- the agent loop: an orbit around the machine, with a return arrowhead -->
  <ellipse cx="1035" cy="195" rx="150" ry="110" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-dasharray="10 10" opacity="0.8"/>
  <g fill="#1a1a19" stroke="#3987e5" stroke-width="3">
    <circle cx="885" cy="195" r="10"/><circle cx="1035" cy="305" r="10"/><circle cx="1185" cy="195" r="10"/>
  </g>
  <circle cx="1035" cy="85" r="12" fill="#3987e5"/>
  <path d="M1035 85 L1020 72 M1035 85 L1020 98" fill="none" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/>

  <!-- MCP: a plug meeting a socket, top right -->
  <g transform="translate(1120 22) rotate(12)">
    <rect x="0" y="0" width="44" height="30" rx="8" fill="#26262a" stroke="#eda100" stroke-width="3"/>
    <rect x="44" y="8" width="14" height="4" rx="2" fill="#eda100"/>
    <rect x="44" y="18" width="14" height="4" rx="2" fill="#eda100"/>
    <rect x="66" y="-4" width="34" height="38" rx="8" fill="#26262a" stroke="#eda100" stroke-width="3"/>
    <rect x="74" y="8" width="8" height="4" rx="2" fill="#5a4a2a"/>
    <rect x="74" y="18" width="8" height="4" rx="2" fill="#5a4a2a"/>
  </g>

  <!-- data blocks: point-in-time layers, bottom right (the quant track) -->
  <g transform="translate(1110 232)">
    <g stroke="#1baf7a" stroke-width="3" fill="#1c2a28">
      <rect x="0" y="40" width="120" height="16" rx="5"/>
      <rect x="10" y="20" width="100" height="16" rx="5"/>
      <rect x="20" y="0" width="80" height="16" rx="5"/>
    </g>
    <g fill="#1baf7a">
      <rect x="30" y="4" width="20" height="8" rx="2"/>
      <rect x="60" y="24" width="20" height="8" rx="2"/>
      <rect x="20" y="44" width="20" height="8" rx="2" opacity="0.6"/>
      <rect x="80" y="44" width="20" height="8" rx="2"/>
    </g>
  </g>

  <!-- ===== CENTER: the person, walking left → right, notebook in hand ===== -->
  <g transform="translate(560 128)">
    <!-- shadow -->
    <ellipse cx="60" cy="204" rx="58" ry="8" fill="#0e0e0e" opacity="0.7"/>

    <!-- back leg -->
    <path d="M52 132 L38 190 L60 196" stroke="#2f3a4f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M32 196 L64 198" stroke="#1a1a19" stroke-width="12" stroke-linecap="round"/>
    <!-- front leg (mid-stride) -->
    <path d="M72 132 L92 176 L120 186" stroke="#3b4a66" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M116 190 L142 184" stroke="#1a1a19" stroke-width="12" stroke-linecap="round"/>

    <!-- body: light shirt, dark vest like the avatar -->
    <path d="M40 66 Q62 56 84 66 L92 140 L32 140 Z" fill="#e9e6df"/>
    <path d="M48 66 L62 62 L62 140 L40 140 Z" fill="#2b2b2e"/>
    <path d="M76 66 L62 62 L62 140 L84 140 Z" fill="#2b2b2e"/>
    <path d="M62 62 L62 140" stroke="#e9e6df" stroke-width="10"/>
    <!-- collar -->
    <path d="M52 62 L62 74 L72 62" fill="none" stroke="#cfcbc2" stroke-width="3" stroke-linejoin="round"/>

    <!-- back arm swinging -->
    <path d="M44 76 L22 112" stroke="#e9e6df" stroke-width="14" stroke-linecap="round"/>
    <circle cx="20" cy="116" r="8" fill="#f2c9a6"/>

    <!-- front arm holding the notebook -->
    <path d="M82 78 L108 100" stroke="#e9e6df" stroke-width="14" stroke-linecap="round"/>
    <circle cx="110" cy="104" r="8" fill="#f2c9a6"/>
    <!-- notebook: open, with a marked correction -->
    <g transform="translate(96 84) rotate(-12)">
      <rect x="0" y="0" width="46" height="34" rx="4" fill="#f6f2e8" stroke="#c9c2b2" stroke-width="2"/>
      <line x1="23" y1="2" x2="23" y2="32" stroke="#d8d1c0" stroke-width="2"/>
      <g stroke="#9a948a" stroke-width="2" stroke-linecap="round">
        <line x1="5" y1="9" x2="18" y2="9"/><line x1="5" y1="15" x2="16" y2="15"/><line x1="5" y1="21" x2="18" y2="21"/>
        <line x1="28" y1="9" x2="41" y2="9"/><line x1="28" y1="21" x2="39" y2="21"/>
      </g>
      <!-- the struck-through line + a small orange mark: 'correction is marked' -->
      <line x1="28" y1="15" x2="40" y2="15" stroke="#9a948a" stroke-width="2" stroke-linecap="round"/>
      <line x1="27" y1="15" x2="41" y2="15" stroke="#d95926" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="43" cy="26" r="3" fill="#d95926"/>
    </g>

    <!-- head -->
    <circle cx="62" cy="34" r="30" fill="#f2c9a6"/>
    <!-- hair: dark, swept -->
    <path d="M32 30 C 30 8, 54 -4, 74 6 C 88 12, 94 24, 92 34 C 84 22, 70 20, 60 24 C 52 27, 44 30, 32 30 Z" fill="#1f1f22"/>
    <!-- ear -->
    <circle cx="90" cy="38" r="5" fill="#e8b892"/>
    <!-- glasses: round, like the avatar -->
    <g fill="none" stroke="#1f1f22" stroke-width="3">
      <circle cx="52" cy="40" r="10"/><circle cx="76" cy="40" r="10"/>
      <line x1="62" y1="40" x2="66" y2="40"/>
      <line x1="86" y1="38" x2="92" y2="36"/>
    </g>
    <!-- eyes: looking right, toward the bright side -->
    <circle cx="55" cy="41" r="2.6" fill="#1f1f22"/>
    <circle cx="79" cy="41" r="2.6" fill="#1f1f22"/>
    <!-- smile -->
    <path d="M56 54 Q64 60 72 54" fill="none" stroke="#b5774f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- a few particles being pulled toward the right (momentum) -->
  <g fill="#3987e5">
    <circle cx="760" cy="150" r="3" opacity="0.5"/><circle cx="800" cy="210" r="2.5" opacity="0.6"/>
    <circle cx="840" cy="120" r="2" opacity="0.5"/><circle cx="820" cy="260" r="3" opacity="0.7"/>
    <circle cx="880" cy="200" r="2.5" opacity="0.8"/>
  </g>
</svg>
